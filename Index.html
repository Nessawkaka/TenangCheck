<!DOCTYPE html>
<html lang="ms" data-pal="teluk" data-dark="0" data-size="0">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TenangCheck: Semak dulu sebelum klik</title>
<meta name="description" content="Semak mesej dan nombor telefon sebelum anda klik. Lapor nombor scammer tanpa log masuk. Belajar mengenali scam.">
<meta name="theme-color" content="#0B2545">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23FF6B35'/%3E%3Cpath d='M12 4l7 2.6v5.2c0 4.4-3 7-7 7.9-4-.9-7-3.5-7-7.9V6.6z' fill='none' stroke='%230B2545' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Sora:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--font-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--font-head:Sora,"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--fs-xs:.85rem;--fs-sm:.92rem;--fs-md:1rem;--fs-lg:1.15rem;--fs-xl:1.4rem;--fs-2xl:1.75rem;--fs-3xl:2.6rem;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-padding-bottom:calc(5.5rem + env(safe-area-inset-bottom,0px));font-size:106.25%;-webkit-text-size-adjust:100%;background:var(--brand)}
html[data-size="1"]{font-size:122%}
html[data-size="2"]{font-size:140%}
html[data-size="3"]{font-size:160%}
[hidden]{display:none!important}

/* ---------- Palette: Teluk ---------- */
html[data-pal="teluk"]{
 --bg:#F2F8FA;--surface:#FFFFFF;--surface2:#E3F3F6;--ink:#0B2545;--muted:#47607A;--line:#CFE0E8;--ctl:#6B8094;
 --brand:#0B2545;--brand-ink:#FFFFFF;--accent:#FF6B35;--accent-ink:#0B2545;--link:#00667A;--focus:#0B2545;
 --hero-a:#0B2545;--hero-b:#14406E;--hero-ink:#FFFFFF;--hl1:#0F5C7A;--hl2:#00A6B8;--hl3:#5CE1E6;--sun:#FF6B35;
 --phone:#F4FBFD;--phone-edge:#0B2545;--screen:#0E7C8C;--chip:#E3F3F6;--chip-ink:#0B2545}
html[data-pal="teluk"][data-dark="1"]{
 --bg:#07162B;--surface:#0E2340;--surface2:#143056;--ink:#EAF4F8;--muted:#A9BDCF;--line:#25415F;--ctl:#6F8CAB;
 --brand:#041021;--accent:#FF7F50;--accent-ink:#0B2545;--link:#5CE1E6;--focus:#5CE1E6;
 --hero-a:#041021;--hero-b:#0B2545;--hl1:#0B3A55;--hl2:#00808F;--hl3:#2FB5BF;--sun:#FF7F50;
 --phone:#12294A;--phone-edge:#5CE1E6;--screen:#00808F;--chip:#143056;--chip-ink:#EAF4F8}

/* ---------- Verdict colours (traffic light, same for both palettes) ---------- */
/* semantic state tokens */
:root{--danger:#B3261E;--danger-fill:#C62828;--on-danger:#FFFFFF;--danger-line:#C62828;--danger-tint:#FDE6E6;--on-danger-tint:#7F1414;--warn-fill:#FFC107;--on-warn:#2B2000;--ok-fill:#1B7A35;--on-ok:#FFFFFF;--alert-bg:#B71C1C;--hover:#D0E9EF}
html[data-dark="1"]{--danger:#FFB4AB;--danger-line:#EF6461;--danger-tint:#3A1212;--on-danger-tint:#FFB4B4;--ok-fill:#3FA55B;--on-ok:#06220F;--hover:#1C3D66}
.v-ok{--vs:#1B7A35;--vi:#FFFFFF;--vt:#E4F4E8;--vx:#0F4D21}
.v-warn{--vs:#FFC107;--vi:#2B2000;--vt:#FFF3C4;--vx:#4D3A00}
.v-bad{--vs:#C62828;--vi:#FFFFFF;--vt:#FDE6E6;--vx:#7F1414}
html[data-dark="1"] .v-ok{--vs:#3FA55B;--vi:#06220F;--vt:#10301A;--vx:#B8F0C6}
html[data-dark="1"] .v-warn{--vs:#FFC107;--vi:#2B2000;--vt:#3A2E06;--vx:#FFE082}
html[data-dark="1"] .v-bad{--vs:#D32F2F;--vi:#FFFFFF;--vt:#3A1212;--vx:#FFB4B4}

body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:var(--fs-md);line-height:1.55;min-height:100vh;min-height:100dvh}
h1,h2,h3{font-family:var(--font-head);line-height:1.2;margin:0;text-wrap:balance}
.qmsg,.tx p,.vbody,blockquote,.rrow{overflow-wrap:anywhere}
[tabindex="-1"]:focus{outline:none}
p,li,blockquote,.ln{text-wrap:pretty}
.card p,.vbody p,.tbody p,.calm p{max-width:65ch}
.vhead span,.tag,.demo,.pill{text-transform:uppercase;letter-spacing:.05em}
.mlab,.prog,.facts dd,.rrow b,.qmsg,.vbody strong,.tx p,.share li{font-variant-numeric:tabular-nums}
.about{margin-top:2.5rem;padding-top:1rem;border-top:1px solid var(--line);color:var(--muted);font-size:var(--fs-sm)}
.about h2{font-size:var(--fs-md);color:var(--ink);margin-bottom:.3rem}
.about p{max-width:65ch}
p{margin:0}
a{color:var(--link);text-underline-offset:.2em;text-decoration-thickness:.08em}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.skip{position:absolute;left:-999px;top:0;background:var(--accent);color:var(--accent-ink);padding:.6rem 1rem;z-index:100}
.skip:focus{left:.5rem}
.ic{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic-lg{width:1.7em;height:1.7em}

/* ---------- Header ---------- */
.top{background:var(--brand);color:var(--brand-ink);padding:.7rem 1rem .5rem;display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:.55rem;font:800 var(--fs-lg)/1.2 var(--font-head)}
.logo{width:2.2rem;height:2.2rem;border-radius:.7rem;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.ctrls{display:flex;gap:.5rem;flex-wrap:wrap}
.hb{min-height:2.75rem;min-width:2.75rem;padding:.3rem .7rem;border-radius:.7rem;border:2px solid rgba(255,255,255,.35);background:transparent;color:var(--brand-ink);font:700 var(--fs-sm)/1.25 var(--font-body);display:inline-flex;align-items:center;gap:.4rem;cursor:pointer}
.hb:focus-visible{outline-color:#fff}
.hb .on{background:#fff;color:#0B2545;border-radius:.4rem;padding:0 .35rem}

/* ---------- Hero ---------- */
.hero{background:linear-gradient(180deg,var(--hero-a),var(--hero-b));color:var(--hero-ink);padding:1.2rem 1rem 0}
.hero-in{max-width:40rem;margin:0 auto}
.hero h1{font-size:var(--fs-2xl);font-weight:800;letter-spacing:-.02em;line-height:1.1}
.hero p{margin-top:.5rem;max-width:30rem;opacity:.95}
.hero svg{display:block;width:100%;height:auto;margin-top:.3rem}
.sun{fill:var(--sun)}.hl1{fill:var(--hl1)}.hl2{fill:var(--hl2)}.hl3{fill:var(--hl3)}.hl4{fill:var(--bg)}
.phone{fill:var(--phone);stroke:var(--phone-edge);stroke-width:3}.screen{fill:var(--screen)}
.bub{fill:var(--phone);stroke:var(--phone-edge);stroke-width:2}.bline{fill:var(--hl2)}

/* ---------- Layout ---------- */
main{max-width:40rem;margin:0 auto;padding:1rem 1rem 7.5rem}
.view>h1{font-size:var(--fs-xl);margin:.4rem 0 .8rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:1rem;padding:1rem;margin-top:1rem}
.card h3{font-size:var(--fs-lg);margin-bottom:.5rem}
.muted{color:var(--muted)}
.small{font-size:var(--fs-xs)}
.stack>*+*{margin-top:.8rem}

/* ---------- Controls ---------- */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:.3rem;background:var(--surface2);padding:.3rem;border-radius:1rem;margin:1rem 0 0}
.seg button{min-height:3rem;border:0;border-radius:.75rem;background:transparent;color:var(--ink);font:700 var(--fs-md)/1.25 var(--font-body);cursor:pointer}
.seg button[aria-selected="true"]{background:var(--surface);box-shadow:0 0 0 2px var(--link) inset;color:var(--link)}
.chips{display:flex;gap:.5rem;flex-wrap:wrap}
.chips.scroll{flex-wrap:wrap}
.chip{min-height:2.75rem;padding:.3rem .9rem;border-radius:99px;border:2px solid var(--ctl);background:var(--chip);color:var(--chip-ink);font:700 var(--fs-sm)/1.25 var(--font-body);cursor:pointer;white-space:nowrap}
.chip[aria-selected="true"]{background:var(--link);color:var(--bg);border-color:var(--link)}
label,.lbl{display:block;font-weight:700;margin-bottom:.35rem}
textarea,input[type=text],input[type=tel],input[type=date],select{width:100%;min-height:3rem;padding:.65rem .8rem;border-radius:.8rem;border:2px solid var(--ctl);background:var(--surface);color:var(--ink);font:inherit}
textarea{min-height:8rem;resize:vertical}
textarea:focus,input:focus,select:focus{border-color:var(--link)}
.btn{min-height:3rem;padding:.65rem 1.1rem;border-radius:.9rem;border:2px solid transparent;font:700 var(--fs-md)/1.25 var(--font-body);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.5rem;text-decoration:none}
.btn-p{background:var(--accent);color:var(--accent-ink)}
.btn-s{background:var(--surface);color:var(--ink);border-color:var(--ctl)}
.btn-w{width:100%}
.btn-bad{background:var(--danger-fill);color:var(--on-danger)}
.btn-ok{background:var(--ok-fill);color:var(--on-ok)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.row{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.8rem}
.err{color:var(--danger);font-weight:700;margin-top:.5rem}
.err:empty{display:none}
.hp{position:absolute;left:-9999px;opacity:0;height:0;width:0}

/* ---------- Verdict ---------- */
.verdict{margin-top:1rem;border:2px solid var(--vs);background:var(--vt);color:var(--vx);border-radius:1rem;overflow:hidden}
.vhead{background:var(--vs);color:var(--vi);display:flex;align-items:center;gap:.6rem;padding:.7rem 1rem;font:800 var(--fs-xl)/1.15 var(--font-head)}
.vbody{padding:1rem}
.vbody>*+*{margin-top:.8rem}
.vline{font-weight:700;font-size:var(--fs-lg)}
.vbody h3{font-size:var(--fs-md);color:var(--vx)}
.vbody a{color:var(--vx)}
.meter{height:.8rem;border-radius:99px;background:rgba(0,0,0,.14);overflow:hidden;box-shadow:inset 0 0 0 1px var(--vx)}
.meter i{display:block;height:100%;width:100%;background:var(--vs);transform-origin:left center;transform:scaleX(0);transition:transform .5s ease-out}
.mlab{font-size:var(--fs-xs);margin-top:.25rem}
ul.sigs,ul.plain{list-style:none;margin:0;padding:0}
ul.sigs li{display:flex;gap:.5rem;padding:.25rem 0}
.facts{display:grid;grid-template-columns:auto 1fr;gap:.2rem .8rem;margin:0}
.facts dt{font-weight:700}.facts dd{margin:0}
.demo{display:inline-block;font-size:var(--fs-xs);font-weight:700;border:2px solid var(--vx);border-radius:99px;padding:0 .6rem}

/* ---------- Lists / cards ---------- */
.rrow{width:100%;text-align:left;display:flex;gap:.7rem;align-items:center;background:var(--surface2);border:0;border-radius:.8rem;padding:.7rem .8rem;margin-top:.5rem;color:var(--ink);font:inherit;cursor:pointer;min-height:3rem}
.rrow b{display:block}
.pill{display:inline-block;border-radius:99px;padding:0 .6rem;font-weight:700;font-size:var(--fs-xs);background:var(--danger-fill);color:var(--on-danger)}
.pill.w{background:var(--warn-fill);color:var(--on-warn)}
.sign{display:flex;gap:.8rem;align-items:flex-start;padding:.7rem 0;border-top:1px solid var(--line)}
.sign:first-child{border-top:0}
.sign .bub2{width:2.6rem;height:2.6rem;border-radius:.8rem;background:var(--surface2);color:var(--link);display:grid;place-items:center;flex:none}
.sign h3{font-size:var(--fs-md);margin:0}
details.type{background:var(--surface);border:1px solid var(--line);border-radius:1rem;margin-top:.6rem}
details.type summary{display:flex;gap:.7rem;align-items:center;padding:.8rem 1rem;min-height:3.2rem;cursor:pointer;font:700 var(--fs-md)/1.25 var(--font-head);list-style:none}
details.type summary::-webkit-details-marker{display:none}
details.type summary>.ic:last-child{margin-left:auto;transition:transform .2s}
details.type[open] summary>.ic:last-child{transform:rotate(90deg)}
.tbody{padding:0 1rem 1rem}
.tbody>*+*{margin-top:.7rem}
.tbody h4{margin:0 0 .15rem;font-size:var(--fs-sm)}
blockquote{margin:0;padding:.6rem .8rem;border-left:4px solid var(--accent);background:var(--surface2);border-radius:.4rem}
.srclinks{display:flex;gap:.5rem;flex-wrap:wrap}
.srclinks a,.src a{display:inline-flex;gap:.4rem;align-items:center;min-height:2.75rem}
.src{display:block;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:1rem;padding:.8rem 1rem;margin-top:.6rem}
.src b{color:var(--link);display:flex;gap:.4rem;align-items:center}
.src span{display:block;font-size:var(--fs-sm);color:var(--muted)}
.mf{border-top:1px solid var(--line);padding:.8rem 0}
.mf:first-child{border-top:0}
.tag{display:inline-block;font-weight:800;font-size:var(--fs-xs);border-radius:.4rem;padding:0 .5rem;margin-right:.4rem}
.tag.m{background:var(--danger-fill);color:var(--on-danger)}.tag.f{background:var(--ok-fill);color:var(--on-ok)}

/* ---------- Script / quiz / share ---------- */
.ln{display:block;width:100%;text-align:left;border:2px solid var(--ctl);background:var(--surface);color:var(--ink);border-radius:.9rem;padding:.7rem .9rem;margin-top:.5rem;font:inherit}
.ln.you{border-color:var(--line);background:var(--surface2);margin-left:1.5rem;width:calc(100% - 1.5rem)}
button.ln{cursor:pointer}
button.ln[aria-expanded="true"],button.ln.flag{border-color:var(--danger-line)}
.ln .why{display:block;margin-top:.4rem;font-weight:700;color:var(--danger)}
.prog{font-weight:700;color:var(--muted)}
.qmsg{background:var(--surface2);border-radius:.9rem;padding:1rem;margin:.7rem 0;font-weight:700;border:2px dashed var(--line)}
.qbtns{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.share{background:linear-gradient(180deg,var(--hero-a),var(--hero-b));color:#fff;border-radius:1.2rem;padding:1.2rem}
.share h3{font-size:var(--fs-lg);margin-bottom:.6rem}
.share ol{margin:0;padding-left:1.3rem}.share li{margin:.4rem 0}
.share .foot{margin-top:.8rem;font-weight:700;display:flex;gap:.4rem;align-items:center;color:var(--hl3)}

/* ---------- Call demo ---------- */
.tx{max-height:16rem;overflow:auto;border:2px solid var(--line);border-radius:.9rem;padding:.6rem;margin-top:.7rem;background:var(--surface)}
.tx p{padding:.4rem .6rem;border-radius:.6rem;background:var(--surface2);margin:.3rem 0}
.tx p.hot{background:var(--danger-tint);color:var(--on-danger-tint);font-weight:700}
.yn{display:grid;grid-template-columns:1fr auto auto;gap:.5rem;align-items:center;padding:.6rem 0;border-top:1px solid var(--line)}
.yn:first-of-type{border-top:0}
.yn button{min-height:3rem;min-width:4rem;border-radius:.8rem;border:2px solid var(--ctl);background:var(--surface);color:var(--ink);font:700 var(--fs-md)/1.25 var(--font-body);cursor:pointer}
.yn button[aria-pressed="true"]{background:var(--link);color:var(--bg);border-color:var(--link)}

/* ---------- Emergency ---------- */
.calm{background:var(--hero-a);color:#fff;border-radius:1rem;padding:1.1rem}
.calm h1{font-size:var(--fs-xl)}.calm p{margin-top:.4rem;max-width:65ch}
.note{max-width:65ch;border-left:5px solid var(--link);background:var(--surface2);border-radius:.5rem;padding:.7rem .9rem;margin-top:1rem;font-weight:700}
.ck{display:flex;gap:.7rem;align-items:flex-start;padding:.7rem 0;border-top:1px solid var(--line);cursor:pointer;font-weight:400;margin:0}
.ck:first-of-type{border-top:0}
.ck input{width:1.7rem;height:1.7rem;flex:none;accent-color:var(--link);margin:.1rem 0 0}
.ck small{display:block;color:var(--muted)}

/* ---------- Bottom nav ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:2px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding:.3rem .4rem calc(.3rem + env(safe-area-inset-bottom,0px))}
.tabs button{min-height:3.5rem;border:0;background:transparent;color:var(--muted);font:700 var(--fs-xs)/1.2 var(--font-body);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1rem;border-radius:.8rem;cursor:pointer}
.tabs button[aria-current="page"]{color:var(--link);background:var(--surface2)}
.tabs .ic{width:1.5em;height:1.5em}

/* ---------- Overlays ---------- */
dialog{border:0;border-radius:1.2rem;padding:0;width:min(32rem,94vw);background:var(--surface);color:var(--ink);max-height:90vh}
dialog::backdrop{background:rgba(5,12,28,.6)}
dialog[open]{display:block}
dialog form{padding:1.1rem}
dialog form>*+*{margin-top:.8rem}
.alertscr{position:fixed;inset:0;z-index:60;background:var(--alert-bg);color:#fff;padding:calc(1.5rem + env(safe-area-inset-top,0px)) 1.3rem calc(1.5rem + env(safe-area-inset-bottom,0px));overflow:auto}
.alertscr h2{font-size:var(--fs-2xl);margin:.6rem 0}
.alertscr ol{font-size:var(--fs-lg);padding-left:1.3rem}.alertscr li{margin:.6rem 0}
.alertscr .btn{margin-top:.8rem;width:100%}
.alertscr .btn-s{background:#fff;color:#7F1414;border-color:#fff}
.alertscr .btn-s:hover{background:#FDE6E6}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(5.5rem + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:.6rem 1rem;border-radius:.8rem;font-weight:700;z-index:70;max-width:90vw}

/* ---------- Layout helpers (mobile = single column) ---------- */
.hero{margin:-1rem -1rem 0}
.hero-txt{padding-bottom:.4rem}
.alertscr h2,.alertscr ol,.alertscr #alertBtns{max-width:42rem;margin-left:auto;margin-right:auto}

@media (hover:hover){
 .btn-p:hover,.btn-bad:hover,.btn-ok:hover{filter:brightness(1.07)}
 .btn-s:hover,.chip:not([aria-selected="true"]):hover,.rrow:hover,.yn button:not([aria-pressed="true"]):hover,button.ln:hover,.src:hover,details.type summary:hover,.seg button:not([aria-selected="true"]):hover{background:var(--hover)}
 .hb:hover{background:rgba(255,255,255,.14)}
 .tabs button:not([aria-current]):hover{background:var(--surface2);color:var(--ink)}
 a:hover{text-decoration-thickness:.14em}
}
@keyframes tc-fade{from{opacity:0}to{opacity:1}}
.out>.verdict{animation:tc-fade .15s ease-out}
/* ---------- Desktop ---------- */
@media (min-width:900px){
 .top{padding:.8rem 2rem}
 .tabs{position:static;display:flex;gap:.3rem;background:transparent;border:0;padding:0;margin:0 auto 0 1.5rem;z-index:auto}
 .tabs button{flex-direction:row;gap:.5rem;min-height:2.9rem;padding:0 1.1rem;color:rgba(255,255,255,.88);font-size:var(--fs-sm)}
 .tabs button:focus-visible{outline-color:#fff}
 .tabs button[aria-current="page"]{background:rgba(255,255,255,.18);color:#fff}
 .tabs button:not([aria-current]):hover{background:rgba(255,255,255,.1);color:#fff}
 html{scroll-padding-bottom:0}
 .tabs .ic{width:1.25em;height:1.25em}
 main{max-width:72rem;padding:1.5rem 2rem 3rem}
 #toast{bottom:2rem}
 .alertscr .ic{display:block;margin:0 auto}
 .hero{margin:0;border-radius:1.5rem;overflow:hidden;padding:2.2rem 2.5rem 0}
 .hero-in{max-width:none;display:grid;grid-template-columns:1fr 1fr;gap:2rem;align-items:end}
 .hero-txt{align-self:center;padding-bottom:2rem}
 .hero h1{font-size:var(--fs-3xl)}
 .hero p{font-size:var(--fs-lg);max-width:26rem}
 .hero svg{margin-top:0}
 .seg{max-width:32rem}
 .chips.scroll{flex-wrap:wrap;overflow:visible}
 .out:empty::before{content:attr(data-empty);display:block;margin-top:1rem;border:2px dashed var(--line);border-radius:1rem;padding:1.6rem 1rem;color:var(--muted);text-align:center}
 .narrow{max-width:40rem;margin-left:auto;margin-right:auto}
 .about{text-align:center}
 .about p{margin:0 auto}
 #v-belajar>h1{text-align:center}
 #lchips{justify-content:center}
}
@media (min-width:900px){
 html:is([data-size="0"],[data-size="1"]) :is(#p-msg,#p-num,#p-call){display:grid;grid-template-columns:1fr 1fr;gap:0 1.5rem;align-items:start}
 html:is([data-size="0"],[data-size="1"]) #p-msg>.card{grid-column:1;grid-row:1}
 html:is([data-size="0"],[data-size="1"]) #msgOut{grid-column:2;grid-row:1}
 html:is([data-size="0"],[data-size="1"]) #p-num>.card:first-child{grid-column:1;grid-row:1}
 html:is([data-size="0"],[data-size="1"]) #numOut{grid-column:2;grid-row:1 / span 2}
 html:is([data-size="0"],[data-size="1"]) #p-num>.card:last-child{grid-column:1;grid-row:2}
 html:is([data-size="0"],[data-size="1"]) #p-call>.card:first-child{grid-column:1;grid-row:1}

/* ============ phone numbers ============ */
function normNum(raw){
  var d=String(raw||"").replace(/\D/g,"");
  if(d==="997"||d==="999")return d;
  if(d.indexOf("00")===0)d=d.slice(2);
  if(d.indexOf("60")===0&&d.length>=10&&d.length<=12)return d;
  if(d.charAt(0)==="0"&&d.length>=9&&d.length<=11)return "6"+d;
  if(d.length>=9&&d.length<=10&&d.charAt(0)!=="0")return "60"+d;
  return null;
}
function showNum(k){if(k==="997"||k==="999")return k;return "+"+k.slice(0,2)+" "+k.slice(2,4)+"-"+k.slice(4,8)+" "+k.slice(8)}
var OFFICIAL={"997":["NSRC (National Scam Response Centre)","NSRC (National Scam Response Centre)"],"999":["Talian kecemasan","Police emergency"]};
BANK_LOOKUP.forEach(function(b){var k=normNum(b[1]);if(k)OFFICIAL[k]=[b[0]+" (hotline fraud, ABM)",b[0]+" (fraud hotline, ABM)"]});

{k:"urgent",w:2,rx:/(segera|sekarang|\bnow\b|immediately|urgent|sebelum \d+|dalam masa \d+|within \d+ (hours?|minutes?)|24 jam|disekat|dibekukan|digantung|blocked|frozen|suspended|tamat tempoh|last chance)/i,l:["Mendesak anda bertindak cepat","Pressures you to act fast"]},
{k:"link",w:3,rx:/(bit\.ly|tinyurl|cutt\.ly|rb\.gy|s\.id|t\.co\/|\.apk\b|https?:\/\/[^\s]*\.(xyz|top|cc|icu|click|vip|site|online|shop|live)\b|http:\/\/|(maybank|cimb|rhb|lhdn|pdrm|jpj|tnb|poslaju|bank)[-_][a-z0-9-]+\.)/i,l:["Pautan pendek, pelik atau tidak selamat","A short, odd or unsafe link"]},
{k:"transfer",w:4,rx:/((pindah|transfer|bank ?in|salur)[^.!?\n]{0,40}(akaun|account|wang|duit|money|rm\s?\d))|akaun selamat|safe account/i,l:["Menyuruh anda memindahkan wang ke “akaun selamat”","Tells you to move money or use a “safe account”"]},

{k:"job",w:4,rx:/(kerja (online|dari rumah|mudah|sambilan)|work from home|easy (job|income)|like (video|videos|page|pages)|gaji rm\s?\d+[^.]{0,25}(sehari|seminggu)|earn rm\s?\d+[^.]{0,25}(a|per) day)/i,l:["Menawarkan kerja mudah bergaji tinggi","Offers an easy, high-paying job"]},
{k:"invest",w:3,rx:/(pulangan|untung|profit|return)[^.!?\n]{0,30}(\d+\s?%|dijamin|guaranteed)|dijamin|guaranteed|bot (ai )?trading|crypto|forex|grup vip|vip group/i,l:["Menjanjikan untung yang dijamin","Promises guaranteed profit"]},
{k:"family",w:3,rx:/\b(hi|hai|hello) (mak|ma|ayah|abah|pa|mum|mom|dad)\b|nombor baru|new number|telefon rosak|phone (is )?(broken|damaged)/i,l:["Mengaku ahli keluarga dengan nombor baharu","Claims to be family on a new number"]},
{k:"chat",w:2,rx:/whatsapp|telegram|wasap/i,l:["Mengajak berbual di WhatsApp atau Telegram","Pushes you to WhatsApp or Telegram"]},

var NEG=/(jangan|do not|don['’]?t|never)\s+(?:\w+\s+){0,2}(kongsi|share|beri|bagi|give|reveal|dedah)[^.!?\n]{0,25}\b(tac|otp|pin|password|kata laluan)\b[^.!?\n]*/gi;

function evaluate(text){
  var s=String(text||"").replace(NEG," ");
  var score=0,sig=[];
  SIG.forEach(function(g){if(g.rx.test(s)){score+=g.w;sig.push(g)}});
  sig.sort(function(a,b){return b.w-a.w});
  return {score:score,pct:Math.min(100,score*10),sig:sig,verdict:score>=6?"bad":score>=3?"warn":"ok"};
}
function findNumbers(text){
  var out=[],seen={};
  (String(text).match(/(?:\+?60|0)\d[\d\s-]{7,12}\d/g)||[]).forEach(function(m){var k=normNum(m);if(k&&!seen[k]){seen[k]=1;out.push(k)}});
  return out;
}
